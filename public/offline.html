<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" />
<title>Sem conexão</title>
<style>
  html, body { margin: 0; height: 100%; background: #f7f5f6; color: #1e1519; font-family: system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  img { width: 88px; height: 88px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: #6b5f64; font-size: 14px; max-width: 320px; }
  button { margin-top: 8px; border: 0; border-radius: 999px; background: #d81b60; color: #fff; font-weight: 700; padding: 10px 22px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>Sem conexão</h1>
  <p>Parece que a internet caiu. Assim que voltar, é só tentar de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
