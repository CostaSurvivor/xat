<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="62%" cy="55%" r="60%">
      <stop offset="0" stop-color="#a3234a" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#4a0e22" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0b0708" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1d77a" stop-opacity="0"/>
      <stop offset=".15" stop-color="#f1d77a" stop-opacity=".9"/>
      <stop offset=".85" stop-color="#d4af37" stop-opacity=".8"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glowline" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="#0b0708"/>
  <ellipse cx="1000" cy="560" rx="720" ry="420" fill="url(#glow)" filter="url(#haze)"/>
  <!-- bokeh -->
  <g fill="#f1d77a">
    <circle cx="1320" cy="220" r="6" opacity=".25"/><circle cx="1180" cy="160" r="3" opacity=".3"/>
    <circle cx="1450" cy="380" r="9" opacity=".12"/><circle cx="880" cy="200" r="4" opacity=".18"/>
    <circle cx="1040" cy="300" r="2.5" opacity=".35"/><circle cx="1500" cy="160" r="4" opacity=".2"/>
  </g>
  <!-- linha contínua: perfil feminino deitado (ombro, cintura, quadril, perna) -->
  <path fill="none" stroke="url(#rim)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowline)" d="
    M 560 700
    C 610 690 640 668 690 662
    C 760 654 800 690 860 712
    C 930 738 990 690 1050 650
    C 1110 610 1200 606 1260 650
    C 1300 680 1330 706 1400 712
    C 1450 716 1500 714 1560 722"/>
  <path fill="none" stroke="#f1d77a" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" d="
    M 600 640 C 612 600 650 580 690 590 C 720 598 736 624 730 652"/>
</svg>
