name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: sexpapo_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/sexpapo_ci
      UPLOAD_DIR: ${{ github.workspace }}/.ci-storage
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Banco de teste (schema + seed)
        run: npx prisma db push --skip-generate && npx tsx prisma/seed.ts
      - name: Tipagem
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npx next build
